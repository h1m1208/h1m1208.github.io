{% for node in include.nodes %}
  <li>
    {% if node.children %}
      <details open>
        <summary>{{ node.title | escape }}</summary>
        <ul>{% include note-tree.html nodes=node.children %}</ul>
      </details>
    {% else %}
      <a href="{{ node.url | relative_url }}"{% if page.url == node.url %} aria-current="page"{% endif %}>{{ node.title | escape }}</a>
    {% endif %}
  </li>
{% endfor %}
